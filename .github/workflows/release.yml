name: Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix app

      - name: Run Tests
        run: npm test --prefix app

      - name: Validate deployment config
        run: |
          echo "Validating deployment config..."
          test -f release/deployment-config.yml
          test -f release/approvals.yml
          grep -q "v2.3.0" release/deployment-config.yml
          echo "Validation complete - release is ready."

  build:
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t lab-app:v2.3.0 .
          echo "Build successful for v2.3.0"

  deploy-production:
    runs-on: ubuntu-latest
    needs: [validate-release, build]
    environment:
      name: production
      url: https://prod.orderflow.example.com/health
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        env:
          API_KEY: ${{ secrets.API_KEY }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          RELEASE_VERSION: v2.3.0
          KUBE_NAMESPACE: production
          HEALTHCHECK_URL: https://prod.orderflow.example.com/health
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh v2.3.0
